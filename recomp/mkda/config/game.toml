# Recompiler input for default.xbe (Mortal Kombat: Deadly Alliance USA Rev 1, 4D57000C, XBE sha1 5aba0b06...),
# written by xbe_symbols with the XDK 4831 signatures as a stand-in for 4721 (see research/mkda-rev1/notes.md),
# then completed by hand: "from XbSymbolDatabase" names come from research/mkda-rev1/symbols-xbsdb.txt. The SDK's
# xdk/4721/signatures.toml was signed from this file; a scan with it gives these addresses again.

[xbe]
path = "assets/default.xbe"
title = 0x4D57000C
entry = 0x15AFBC
xdk = 4721
out = "generated/game"
partitions = 64
code_sections = [".text", "D3D", "D3DX", "DSOUND", "XMV", "XPP"]  # no shader sections in this engine; XMV is the movie decoder
continuations = [0xCAD3E]  # main (0xCABF0) calls _setjmp3(0x2D4C00) at 0xCAD39; tasks longjmp back to its main loop
library = "MKDA.dll"  # <exe>.dll, which the executable delay loads

# extra entry points
[functions]

# functions the host replaces or calls by name, 0 where the image has none
