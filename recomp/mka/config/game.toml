# Recompiler input for default.xbe, written by xbe_symbols

[xbe]
path = "assets/default.xbe"
title = 0x4D570034
entry = 0x2AAC10
xdk = 5849
out = "generated/game"
partitions = 128
code_sections = [".text", "D3D", "D3DX", "XGRPH", "XONLINE", "XNET", "PSFD00", "PSFD_I", "PSFD_B", "PSFD_P", "DSOUND", "XPP"]  # PSFD*: as in Deception (PSGSFD*), kept as code
continuations = [0x19C863]  # main's _setjmp(0x5B8848) return point (call at 0x19C85E): the game longjmps back into its main loop
library = "MKA.dll"  # <exe>.dll, which the executable delay loads

# extra entry points
[functions]
0x3A44A2 = "crt_thread_notify"  # CRT thread notify routine (stored at 0x3A039F into 0x709770, called by XAPI thread startup 0x2AA5B3); follows a noreturn ExitThread call
# functions only referenced by push/mov immediates whose gap-fill walk failed on a bogus decode across their bytes
0x81E50 = "task_fn_81E50"    # task function pushed at 22 sites (0x25372, 0x56710, 0x88A21, ...); missing, it trapped 50 s into a fight
0x1300B0 = "task_fn_1300B0"  # passed to the task creator 0x1C2770 at 0x12FF85
0x14FA80 = "task_fn_14FA80"  # passed to the task creator 0x1C2770 at 0x14F9E9
